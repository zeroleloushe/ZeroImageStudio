<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d4a44"/><stop offset=".55" stop-color="#3f7a6a"/><stop offset="1" stop-color="#e3d08a"/></linearGradient>
<radialGradient id="light" cx=".75" cy=".2" r=".6"><stop offset="0" stop-color="#ffd9a8" stop-opacity=".55"/><stop offset="1" stop-color="#ffd9a8" stop-opacity="0"/></radialGradient>
<linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3cdb2"/><stop offset="1" stop-color="#c98f72"/></linearGradient>
<linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2418"/><stop offset="1" stop-color="#1d120c"/></linearGradient>
<linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#20303f"/><stop offset="1" stop-color="#0f1820"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="800" height="1000" fill="url(#bg)"/>
<rect width="800" height="1000" fill="url(#light)"/>
<circle cx="640" cy="180" r="90" fill="#ffe7c4" opacity=".18" filter="url(#blur)"/>
