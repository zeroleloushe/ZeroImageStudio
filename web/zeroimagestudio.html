<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZeroImageStudio</title>
  <link rel="stylesheet" href="zeroimagestudio.css?v=menufix">
  <script>window.__ZEROIMAGESTUDIO_PAGE = true;</script>
  <script src="icons.js?v=menufix"></script>
</head>
<body data-tab="canvas">
<header class="chrome" id="chrome">
  <div class="menu-bar">
    <div class="logo" title="ZeroImageStudio">Z</div>
    <div class="project">
      <input id="project-name" class="project-name" value="Новый проект" title="Имя проекта">
      <span id="project-dirty" class="project-dirty" title="Есть несохранённые правки">*</span>
    </div>
    <nav class="menubar" id="menubar" aria-label="Меню">
      <div class="menu" data-menu="file">
        <button type="button" class="menu-btn" aria-haspopup="true" aria-expanded="false">Файл</button>
        <div class="menu-pop" role="menu" hidden>
          <button type="button" role="menuitem" data-act="new">Новый проект<kbd>Ctrl+N</kbd></button>
          <button type="button" role="menuitem" data-act="open-project">Открыть проект…</button>
          <button type="button" role="menuitem" data-act="open-image">Открыть изображение…</button>
          <hr>
          <button type="button" role="menuitem" data-act="save">Сохранить<kbd>Ctrl+S</kbd></button>
          <button type="button" role="menuitem" data-act="save-as">Сохранить как…</button>
          <button type="button" role="menuitem" data-act="export-png">Экспорт PNG</button>
          <hr>
          <div class="menu-label">Недавние</div>
          <div id="recent-projects"></div>
        </div>
      </div>
      <div class="menu" data-menu="edit">
        <button type="button" class="menu-btn" aria-haspopup="true" aria-expanded="false">Правка</button>
        <div class="menu-pop" role="menu" hidden>
          <button type="button" role="menuitem" data-act="undo">Отменить<kbd>Ctrl+Z</kbd></button>
          <button type="button" role="menuitem" data-act="redo">Повторить<kbd>Ctrl+Shift+Z</kbd></button>
          <hr>
          <button type="button" role="menuitem" data-act="canvas-size">Размер холста…</button>
          <button type="button" role="menuitem" data-act="fit-canvas">Холст по слою</button>
        </div>
      </div>
      <div class="menu" data-menu="view">
        <button type="button" class="menu-btn" aria-haspopup="true" aria-expanded="false">Вид</button>
        <div class="menu-pop" role="menu" hidden>
          <button type="button" role="menuitem" data-act="fit">Вписать<kbd>Ctrl+0</kbd></button>
          <button type="button" role="menuitem" data-act="zoom100">100%<kbd>Ctrl+1</kbd></button>
          <button type="button" role="menuitem" data-act="layout-focus">Фокус на холсте</button>
          <button type="button" role="menuitem" data-act="layout-all">Всё</button>
          <button type="button" role="menuitem" data-act="reset-layout">Сбросить раскладку</button>
          <hr>
          <div class="menu-label">Панели</div>
          <div id="view-panels"></div>
        </div>
      </div>
      <div class="menu" data-menu="settings">
        <button type="button" class="menu-btn" aria-haspopup="true" aria-expanded="false">Настройки</button>
        <div class="menu-pop" role="menu" hidden>
          <button type="button" role="menuitem" data-act="settings">Настройки…</button>
          <button type="button" role="menuitem" data-act="focus-graph">Открыть в графе ComfyUI</button>
          <button type="button" role="menuitem" data-act="help">Горячие клавиши<kbd>?</kbd></button>
        </div>
      </div>
      <div class="menu" data-menu="help">
        <button type="button" class="menu-btn" aria-haspopup="true" aria-expanded="false">Справка</button>
        <div class="menu-pop" role="menu" hidden>
          <button type="button" role="menuitem" data-act="help">Горячие клавиши<kbd>?</kbd></button>
        </div>
      </div>
    </nav>
    <span class="menu-gap"></span>
    <span class="sys-ind mu mono" id="sys-stats" title="GPU и очередь">…</span>
    <span class="save-state" id="project-sub" hidden title="Есть несохранённые правки"><i></i>Не сохранено</span>
    <button class="b ac" id="btn-collapse" type="button">Свернуть в ноду</button>
  </div>
  <div class="work-bar">
    <div class="tabs">
      <button type="button" class="on" data-tab="canvas" data-i="image" data-s="14">Холст</button>
      <button type="button" data-tab="gallery" data-i="grid" data-s="14">Галерея <em id="gal-count">0</em></button>
      <button type="button" data-tab="lora" data-i="layers" data-s="14">LoRA <em id="lora-count">0</em></button>
      <button type="button" data-tab="presets" data-i="star" data-s="14">Пресеты <em id="preset-count">0</em></button>
    </div>
    <span class="work-gap"></span>
    <button class="b s" id="btn-undo" data-i="undo" data-s="13" type="button" title="Отменить (Ctrl+Z)"></button>
    <button class="b s" id="btn-redo" data-i="redo" data-s="13" type="button" title="Повторить (Ctrl+Shift+Z)"></button>
    <span class="mu preset-label">Пресет</span>
    <select id="preset-select" class="dd" title="Пресет"></select>
    <button class="b s" id="btn-save-preset" type="button">Сохранить как</button>
  </div>
</header>

<div class="cols">
  <div class="toolcol" id="tools">
    <button class="tool" data-tool="move" data-i="move" data-s="17" title="Перемещение (V)"></button>
    <button class="tool on" data-tool="genarea" data-for="edit" data-i="genarea" data-s="17" title="Рамка генерации (G): внутри — перенос, края — размер, снаружи — новая рамка. Кисть и маска рисуют внутри; Alt переносит рамку."></button>
    <hr data-for="edit">
    <button class="tool" data-tool="mask" data-for="edit" data-i="mask" data-s="17" title="Маска (Q): закрасьте, что менять"></button>
    <button class="tool" data-tool="maskerase" data-for="edit" data-i="maskerase" data-s="17" title="Ластик маски: сотрите лишнее с маски"></button>
    <hr>
    <button class="tool" data-tool="select" data-i="select" data-s="17" title="Выделение рамкой (M). Это пиксели, не область модели. «В маску» переносит его в маску."></button>
    <button class="tool" data-tool="lasso" data-i="lasso" data-s="17" title="Лассо (L). «В маску» переносит контур в маску."></button>
    <button class="tool" data-tool="crop" data-i="crop" data-s="17" title="Кадрирование (C)"></button>
    <hr>
    <button class="tool" data-tool="hand" data-i="hand" data-s="17" title="Рука (H, пробел)"></button>
    <button class="tool" data-tool="zoom" data-i="zoom" data-s="17" title="Масштаб (Z)"></button>
    <hr>
    <button type="button" class="tool more-toggle" id="tools-more" data-i="chev" data-s="14" title="Ещё: кисть, ластик, пипетка, трансформ" aria-expanded="false"></button>
    <div id="tools-extra" hidden>
      <button class="tool" data-tool="brush" data-i="brush" data-s="17" title="Кисть (B)"></button>
      <button class="tool" data-tool="eraser" data-i="eraser" data-s="17" title="Ластик пикселей (E)"></button>
      <button class="tool" data-tool="eyedrop" data-i="eyedrop" data-s="17" title="Пипетка (I): берёт основной цвет"></button>
      <button class="tool" data-tool="transform" data-i="transform" data-s="17" title="Трансформ (T)"></button>
    </div>
    <div class="swatches" id="swatches" hidden>
      <button type="button" class="chip primary" id="swatch-primary" title="Основной цвет"></button>
      <button type="button" class="chip secondary" id="swatch-bg" title="Фоновый цвет"></button>
      <input id="swatch" type="color" value="#e7c27a" aria-label="Основной цвет" tabindex="-1">
      <input id="swatch-2" type="color" value="#1b1e24" aria-label="Фоновый цвет" tabindex="-1">
      <button type="button" class="tool swap" id="swatch-swap" title="Поменять основной и фоновый (X)">⇄</button>
      <button type="button" class="tool reset" id="swatch-reset" title="Сбросить цвета (D)">↺</button>
    </div>
    <button class="tool help" id="btn-help" type="button" title="Клавиши (?)">?</button>
  </div>

  <div class="left">
    <div class="node" id="model-node" data-panel="model" style="--c:#ff7a1a">
      <div class="nh"><span class="d"></span>Модель</div>
      <div class="nb" style="gap:5px">
        <div class="mode" id="mode">
          <button type="button" data-pipe="create">Создание</button>
          <button type="button" data-pipe="edit" class="on">Редактирование</button>
        </div>
        <button type="button" class="model-sum" id="model-toggle" aria-expanded="false" aria-controls="model-drawer">
          <span id="model-summary">Krea 2 Edit V2 · diffusion · krea2</span>
          <span class="chev" data-i="chev" data-s="14"></span>
        </button>
        <div class="mode krea-task" id="krea-task" role="group" aria-label="Режим Krea 2 Edit" hidden></div>
        <div class="krea-tips" id="krea-tips" hidden></div>
        <div id="model-warn"></div>
        <div class="model-drawer" id="model-drawer" inert>
          <div class="model-drawer-inner">
            <div id="hint-list"></div>
            <div class="files" id="file-block"></div>
            <details class="adv">
              <summary>Параметры графа</summary>
              <div class="files" id="graph-options" style="margin-top:6px"></div>
            </details>
          </div>
        </div>
      </div>
    </div>
    <script>
      try {
        if (localStorage.getItem("zeroimagestudio.modelDrawer") === "open") {
          var node = document.getElementById("model-node");
          var drawer = document.getElementById("model-drawer");
          node.classList.add("open");
          drawer.inert = false;
          document.getElementById("model-toggle").setAttribute("aria-expanded", "true");
        }
      } catch (e) {}
    </script>
    <div class="node" id="refs-node" data-panel="refs" style="--c:#4aa8ff">
      <div class="nh"><span class="d"></span>Референсы<span class="r" id="ref-cap">для Edit-моделей · 0</span></div>
      <div class="nb">
        <div id="ref-slots"></div>
        <div class="refs" id="ref-list"></div>
        <div class="mu" id="ref-hint" title="В режиме Создание референсы не идут в модель.">Только для LLM · 0</div>
      </div>
    </div>
    <div class="node lora-node" id="lora-node" data-panel="lora" style="--c:#b18cff">
      <div class="nh"><span class="d"></span>LoRA-менеджер<span class="r" id="lora-sum">0 активны</span></div>
      <div class="nb" id="lora-panel"></div>
    </div>
    <div class="node" id="sampler-node" data-panel="sampler" style="--c:#e7c27a">
      <div class="nh"><span class="d"></span>Настройки генерации</div>
      <div class="nb">
        <div class="kv" id="sampler-box"></div>
      </div>
    </div>
  </div>

  <div class="center">
    <div class="node" id="canvas-node" data-panel="canvas" style="--c:#4aa8ff;flex:1">
      <div class="nh canvas-head"><span class="d"></span><span class="ht">Холст</span>
        <span class="mono" id="canvas-info" title="RGB 8 бит">—</span>
        <span class="zoombar">
          <button type="button" class="b s" id="zoom-out" title="Уменьшить">−</button>
          <button type="button" class="b s zoom-read" id="zoom-readout" title="Текущий масштаб">100%</button>
          <button type="button" class="b s" id="zoom-in" title="Увеличить">+</button>
          <button type="button" class="b s" id="zoom-fit" title="Вместить в окно (Ctrl+0)">Вместить</button>
          <button type="button" class="b s" id="zoom-100" title="Масштаб 100% (Ctrl+1)">100%</button>
        </span>
        <span class="r">
          <button class="b s" id="btn-open-image" data-i="open" data-s="12" title="Открыть изображение"><span class="btn-label">Открыть изображение</span></button>
          <button class="b s" id="btn-canvas-fit" data-i="expand" data-s="12" title="Подогнать холст под изображение"></button>
        </span>
      </div>
      <div class="opts" id="tool-options"></div>
      <div class="stage" id="stage"></div>
      <div id="compare-bar" class="compare-bar" hidden><span>До</span><input id="compare-split" type="range" min="0" max="100" value="50" aria-label="Сравнить до и после"><span>После</span><button type="button" class="b s" id="compare-close">Закрыть</button></div>
    </div>
    <div class="node" id="prompt-node" data-panel="prompt" data-prompt="compact" style="--c:#e7c27a">
      <div class="nh"><span class="d"></span><span class="ht">Промт</span><span class="r"><span id="token-est">0 симв.</span><span id="prompt-fold-slot"></span></span></div>
      <div class="nb">
        <textarea id="prompt" class="prompt" rows="2"></textarea>
        <button type="button" class="prompt-fold" id="prompt-fold" data-i="chev" data-s="16" title="Развернуть: негатив, стили, LLM" aria-expanded="false" aria-controls="prompt-extra"></button>
        <div id="prompt-extra">
        <input id="negative" class="f" placeholder="Негативный промт" style="width:100%;font-family:inherit">
        <div class="pp-wrap" id="prompt-presets">
          <div class="pp-bar">
            <button type="button" class="b" id="pp-open" aria-expanded="false" aria-controls="pp-pop" data-i="star" data-s="13">Пресеты промта <em id="pp-count">0</em></button>
            <div class="pp-chips" id="pp-chips"></div>
          </div>
          <div class="pp-pop" id="pp-pop" hidden>
            <div class="row">
              <input id="pp-search" class="f" placeholder="Поиск: имя, категория, текст" style="flex:1;font-family:inherit">
              <button type="button" class="b s" id="pp-create" data-i="plus" data-s="12">Создать</button>
            </div>
            <form id="pp-form" class="pp-form" hidden>
              <input id="pp-name" class="f" placeholder="Имя" style="font-family:inherit">
              <input id="pp-cat" class="f" placeholder="Категория" style="font-family:inherit">
              <textarea id="pp-text" class="f" placeholder="Текст, который подставится при генерации"></textarea>
              <div class="row">
                <span class="mu">Позиция</span>
                <select id="pp-pos" class="dd">
                  <option value="before">ДО промта</option>
                  <option value="after">ПОСЛЕ промта</option>
                </select>
                <button type="submit" class="b ac s">Сохранить</button>
                <button type="button" class="b s" id="pp-cancel">Отмена</button>
              </div>
            </form>
            <div id="pp-list" class="pp-list"></div>
          </div>
        </div>
        <div class="mu" id="prompt-final" style="font-size:10.5px"></div>
        <div class="row llm-row" style="gap:5px">
          <span id="llm-state" class="llm-state" title="Адрес LLM задаётся в Настройках → Сервисы">LLM не настроен</span>
          <button class="b s" id="llm-improve" data-i="wand" data-s="12">Улучшить</button>
          <button class="b s" id="llm-extend" data-i="pen" data-s="12">Дописать</button>
          <button class="b s" id="llm-describe" data-i="image" data-s="12">Описать изображение</button>
          <select id="llm-preset" class="dd" title="Пресет LLM"></select>
          <button class="b s" id="btn-system" data-i="gear" data-s="12">Системный промт</button>
        </div>
        </div>
        <div class="pp-compact" id="pp-compact" hidden></div>
        <div class="progress-line" id="gen-progress" style="display:none"><i></i></div>
        <div class="gen-row">
          <div class="place-toggle" id="place-toggle" role="group" aria-label="Куда класть результат">
            <button type="button" data-place="layer">Новый слой</button>
            <button type="button" data-place="replace">Заменить</button>
          </div>
          <div class="gen-wrap" id="gen-wrap">
            <button class="gen" id="btn-gen" type="button"><span data-i="play" data-s="14"></span><span id="gen-label">Сгенерировать</span> <span class="mono" id="gen-batch" style="font-weight:500;font-size:11px;opacity:.75">×1</span><span class="gen-key mono"> · Ctrl+↵</span></button>
            <div class="gen-miss" id="gen-miss" hidden></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="right">
    <div class="node" id="inspector-node" data-panel="inspector" style="--c:#ff5c7a">
      <div class="nh">
        <span class="d" title="Свернуть"></span>
        <span class="ht">Инспектор</span>
        <span class="r" id="insp-meta">весь холст</span>
        <button type="button" class="b s icon-btn" id="btn-gen-full" data-i="expand" data-s="13" title="Весь холст" aria-pressed="true"></button>
      </div>
      <div class="nb" id="inspector"></div>
    </div>
    <div class="node" id="layers-node" data-panel="layers" style="--c:#3ddc97">
      <div class="nh"><span class="d"></span>Слои
        <span class="r">
          <button class="b s icon-btn" id="btn-layer-up" type="button" title="Слой выше" aria-label="Слой выше">▲</button>
          <button class="b s icon-btn" id="btn-layer-down" type="button" title="Слой ниже" aria-label="Слой ниже">▼</button>
          <button class="b s" id="btn-layer-add" data-i="plus" data-s="13" title="Пустой слой"></button>
          <button class="b s" id="btn-layer-dup" data-i="layers" data-s="13" title="Дублировать"></button>
          <button class="b s" id="btn-layer-del" data-i="trash" data-s="13" title="Удалить"></button>
        </span>
      </div>
      <div class="nb" style="gap:3px">
        <div class="layers-note mu" id="layers-note" hidden title="Весь холст заменяется новым кадром. Прошлый остаётся в отмене и в галерее.">Кадр заменяется</div>
        <div class="row layer-blend" style="margin-bottom:4px">
          <select id="layer-blend" class="dd"></select>
          <span class="mu">Непрозр.</span>
          <input id="layer-opacity" class="f" value="100%">
        </div>
        <div id="layer-list" style="display:flex;flex-direction:column;gap:3px"></div>
      </div>
    </div>
    <div class="node" id="gallery-node" data-panel="gallery" data-kind="gens" style="--c:#4aa8ff;flex:1">
      <div class="nh"><span class="d"></span>Галерея<span class="r" id="gal-sort-label">сортировка: новые</span></div>
      <div class="nb">
        <div class="gal-kind" id="gal-kind" role="group" aria-label="Генерации или ассеты">
          <button type="button" data-kind="gens" class="on">Генерации</button>
          <button type="button" data-kind="assets">Ассеты</button>
        </div>
        <div class="gal-scope" id="gal-scope" role="group" aria-label="Все или этот проект">
          <button type="button" data-scope="all" class="on">Все</button>
          <button type="button" data-scope="project">Этот проект</button>
        </div>
        <div class="row gal-filters">
          <select id="gal-model" class="dd" title="Фильтр по модели"></select>
          <select id="gal-lora" class="dd" title="Фильтр по LoRA"></select>
          <select id="gal-sort" class="dd" title="Сначала новые">
            <option value="new">Новые</option>
            <option value="old">Старые</option>
          </select>
        </div>
        <div class="gal" id="gal"></div>
        <button type="button" class="b s" id="gal-more" hidden>Ещё</button>
        <div id="gal-legend" style="display:flex;gap:10px;font-size:10.5px;color:#7d8594;margin-top:2px;flex-wrap:wrap"></div>
      </div>
    </div>
  </div>
</div>

<div class="full" id="view-presets">
  <div class="node" style="--c:#e7c27a;flex:1;width:100%">
    <div class="nh"><span class="d"></span>Пресеты</div>
    <div class="nb" id="preset-page" style="flex:1"></div>
  </div>
</div>

<div id="pop" class="pop" hidden></div>
<div id="toast" class="toast" hidden></div>
<input id="file-open" type="file" accept=".zip,.zeroimagestudio.zip,application/zip" hidden>
<input id="file-ref" type="file" accept="image/*" multiple hidden>
<input id="file-layer" type="file" accept="image/*" hidden>

<div id="modal"></div>
<script>
try {
  if (localStorage.getItem("zeroimagestudio.promptMode") === "full") {
    document.getElementById("prompt-node").dataset.prompt = "full";
  }
} catch (e) {}
</script>
<script src="zeroimagestudio_size.js?v=menufix"></script>
<script src="zeroimagestudio_util.js?v=menufix"></script>
<script src="zeroimagestudio_models.js?v=menufix"></script>
<script src="zeroimagestudio_ux.js?v=menufix"></script>
<script src="zeroimagestudio_app.js?v=menufix"></script>
</body>
</html>
